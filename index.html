<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bun resolves this from disk and emits a hashed copy, so it must be a
         real relative path rather than a bare "/favicon.ico". -->
    <link rel="icon" href="./public/favicon.ico" sizes="any" />
    <!-- Theme before first paint: saved choice, else the system setting. -->
    <script>
      try {
        var saved = localStorage.getItem('paragon-theme')
        document.documentElement.dataset.theme =
          saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch (e) {}
    </script>
    <title>Paragon Logistics</title>
    <meta
      name="description"
      content="Paragon Logistics Ltd. — logistics, supply chain management, freight operations and customs clearance in Israel. Agent of Nippon Express."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Source+Sans+3:wght@400;600;700&family=Heebo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
