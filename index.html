<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bun resolves this from disk and emits a hashed copy, so it must be a
         real relative path rather than a bare "/favicon.ico". -->
    <link rel="icon" href="./public/favicon.ico" sizes="any" />
    <!-- Theme before first paint. The site is light only for now: DARK_MODE must
         match DARK_MODE_ENABLED in src/site/features.ts. When it is true, the
         theme is light unless the visitor chose dark themselves (the system's
         colour scheme is deliberately not consulted). -->
    <script>
      var DARK_MODE = false
      try {
        document.documentElement.dataset.theme =
          DARK_MODE && localStorage.getItem('paragon-theme') === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <title>Paragon Logistics</title>
    <meta
      name="description"
      content="Paragon Logistics Ltd. — logistics, supply chain management, freight operations and customs clearance in Israel. Agent of Nippon Express."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Source+Sans+3:wght@400;600;700&family=Heebo:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
