# Keeps the NX Group numbers on the Nippon Express page current.
#
# Deliberately a scheduled pull request rather than a step in the deploy:
# scraping a third party during a build makes every deploy depend on their
# uptime and markup, and ships whatever they happened to serve without anyone
# reading it. NX updates these figures a few times a year, so a weekly check
# is ample and a human still approves the change.
#
# Note: `deploy-pages.yml` triggers on pushes to every branch, so the branch
# this opens will also produce a branch preview until the pull request is
# merged or closed.
name: Refresh NX Group figures

on:
  schedule:
    # Mondays at 06:17 UTC — off the hour, since every scheduled job on the
    # platform piles onto :00 and GitHub delays the busiest slots.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  # Deliberately ignored *here*, unlike in the deploy. Surfacing a figure NX has
  # newly published is the whole point of this job, so it must be able to finish
  # and open the pull request. The deploy is what refuses to ship it untranslated.
  IGNORE_NX_INFORMATION: 'true'

concurrency:
  group: refresh-nx-figures
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --silent

      - name: Fetch the latest figures
        run: bun run nx:figures

      # A failed scrape throws rather than writing a partial file, so reaching
      # here with no diff genuinely means the numbers are unchanged.
      - name: Stop if the numbers have not moved
        id: diff
        run: |
          if git diff --quiet -- src/content/nx-figures.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "NX figures unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff -- src/content/nx-figures.json
          fi

      # Guards against a scrape that parses but produces something the pages
      # cannot render — the content files interpolate these values directly.
      - name: Type-check with the new figures
        if: steps.diff.outputs.changed == 'true'
        run: bun run typecheck

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          branch="nx-figures/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/content/nx-figures.json
          git commit -m "Refresh NX Group figures from nipponexpress.com"
          git push --force -u origin "$branch"

          {
            echo "NX Group has changed the headline numbers published on"
            echo "<https://www.nipponexpress.com/about/>."
            echo
            echo "Scraped by \`scripts/fetch-nx-figures.ts\` into \`src/content/nx-figures.json\`."
            echo "Both language files interpolate these values, so please read the Nippon"
            echo "Express page in **both** languages before merging — in particular, check"
            echo "that surrounding wording still agrees with the new numbers (an ordinal"
            echo "like \"4th\", or a phrase such as \"over\")."
            echo
          } > /tmp/pr-body.md

          # An untracked figure means NX publishes something the site has no
          # translation for. Merging this as-is will stop the next deploy, by
          # design — so say that here rather than letting main go red unexplained.
          untracked="$(bun --print 'require("./src/content/nx-figures.json").untracked.map(u => `- **${u.label}**: ${u.value}`).join("\n")')"
          if [ -n "$untracked" ]; then
            {
              echo "> [!WARNING]"
              echo "> **This will fail the deploy until it is translated.**"
              echo
              echo "NX now publishes figures this site does not carry:"
              echo
              echo "$untracked"
              echo
              echo "Before merging, carry each one — add it to \`WANTED\` in"
              echo "\`scripts/fetch-nx-figures.ts\`, expose it in \`src/content/nx.ts\`, and write"
              echo "a label in **both** \`en.ts\` and \`he.ts\`. If these figures should not"
              echo "appear on the site at all, set the \`IGNORE_NX_INFORMATION\` repository"
              echo "variable to \`true\` instead."
            } >> /tmp/pr-body.md
          fi

          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Refresh NX Group figures from nipponexpress.com" \
              --body-file /tmp/pr-body.md
          fi
