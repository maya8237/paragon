name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Reports whether the NX Group information on the site is current and carried
  # in both languages, and opens a pull request when it is not.
  #
  # continue-on-error, and independent of `build` and `deploy`, on purpose:
  # nothing NX publishes upstream can make our built site wrong, so nothing NX
  # publishes should stop it shipping. The weekly run in nx-information.yml is
  # the same check without the safety net, and that is what sends the reminder.
  nx-validation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate NX Group information
        uses: ./.github/actions/nx-validation
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # The github-pages environment only allows deployments from `main`, so a
  # push to any other branch can't deploy directly — it asks a fresh run on
  # `main` to do it instead, which rebuilds every branch anyway.
  trigger-main-deploy:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a deploy run on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches" \
            -f ref=main

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build every branch
        run: |
          set -e
          mkdir -p output
          for branch in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin | sed 's#^origin/##' | grep -vx 'HEAD'); do
            echo "::group::Building $branch"
            worktree="$RUNNER_TEMP/build-$(echo "$branch" | tr '/' '-')"
            git worktree add --detach "$worktree" "origin/$branch"

            build_ok=1
            if [ "$branch" = "main" ]; then
              (cd "$worktree" && bun install --silent && bun run build:pages) || build_ok=0
            else
              (cd "$worktree" && bun install --silent && PAGES_BASE="${{ github.event.repository.name }}/$branch" bun run build:pages) || build_ok=0
            fi

            if [ "$build_ok" -eq 0 ]; then
              echo "::warning::Skipping '$branch' — build failed"
            elif [ "$branch" = "main" ]; then
              cp -r "$worktree/dist/." output/
            else
              mkdir -p "output/$branch"
              cp -r "$worktree/dist/." "output/$branch/"
            fi

            git worktree remove --force "$worktree"
            echo "::endgroup::"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
